 <div>
       <!-- Hero Carousel -->
    <app-card-carousel
      [items]="heroItems"
      type="hero"
      [autoplayDelay]="5000"
    ></app-card-carousel>
    <!-- Recommended with subscriptions -->
    <app-card-carousel
      [items]="recommendedItems"
      type="recommended"
      sectionTitle="Top-rated TV shows on IMDb"
      [slideWidth]="280"
      [spaceBetween]="16"
    ></app-card-carousel>

    <!-- Subscriptions you might like -->
    <app-card-carousel
      [items]="subscriptionItems"
      type="subscription"
      sectionTitle="Filmfare OTT Award Winners"
    ></app-card-carousel>

    <!-- Top 10 with subscriptions -->
    <app-card-carousel
      [items]="top10Items"
      type="top10"
      sectionTitle="Comedy TV"
      [showArrowIcon]="true"
      [slideWidth]="340"
      [spaceBetween]="16"
    ></app-card-carousel>

    <!-- Optional: Grid Layout -->
    <app-card-carousel
      [items]="gridItems"
      type="grid"
      sectionTitle="Top 10 TV shows in India"
      gridClasses="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"
    ></app-card-carousel>
 </div>
